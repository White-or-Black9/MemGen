<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <title>Original MemGen versus session-local latent memory management</title>
  <desc>Editable vector architecture diagram. Dark gray denotes reasoning and control, blue denotes generated latent memory, and purple denotes session-local memory access and write.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#343434"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5aa6"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b318f"/></marker>
    <style>
      .panel { fill:#ffffff; stroke:#9aa9bd; stroke-width:1.25; }
      .panel-right { fill:#ffffff; stroke:#b595cb; stroke-width:1.25; }
      .module { fill:#f8fafc; stroke:#274f8f; stroke-width:1.5; }
      .node { fill:#ffffff; stroke:#404040; stroke-width:1.2; }
      .bank { fill:#fcfaff; stroke:#6b318f; stroke-width:1.6; }
      .control { fill:none; stroke:#343434; stroke-width:2; marker-end:url(#arrow-gray); }
      .trunk { fill:none; stroke:#343434; stroke-width:2; }
      .control-dashed { fill:none; stroke:#343434; stroke-width:2; stroke-dasharray:6 5; marker-end:url(#arrow-gray); }
      .latent { fill:none; stroke:#1f5aa6; stroke-width:2.25; marker-end:url(#arrow-blue); }
      .memory { fill:none; stroke:#6b318f; stroke-width:2.2; marker-end:url(#arrow-purple); }
      .memory-dashed { fill:none; stroke:#6b318f; stroke-width:1.5; stroke-dasharray:5 4; marker-end:url(#arrow-purple); }
      .title { font-family:Georgia, 'Times New Roman', serif; font-size:22px; font-weight:600; fill:#1f3f78; }
      .title-right { font-family:Georgia, 'Times New Roman', serif; font-size:22px; font-weight:600; fill:#572477; }
      .label { font-family:Georgia, 'Times New Roman', serif; font-size:16px; fill:#161616; }
      .small { font-family:Georgia, 'Times New Roman', serif; font-size:12.5px; fill:#353535; }
      .tiny { font-family:Georgia, 'Times New Roman', serif; font-size:11.5px; fill:#353535; }
      .gray { fill:#343434; } .blue { fill:#1f5aa6; } .purple { fill:#6b318f; }
    .token-cell{fill:#f1eafa;stroke:#6b318f;stroke-width:1}.bank-title{font-family:Georgia,'Times New Roman',serif;font-size:14px;font-weight:600;fill:#572477}.slot-label{font-family:Georgia,'Times New Roman',serif;font-size:12px;fill:#572477}.ellipsis{font-size:14px;fill:#572477}.separator{stroke:#b595cb;stroke-width:1;stroke-dasharray:3 3}.bank-foot{font-family:Georgia,'Times New Roman',serif;font-size:10px;fill:#572477}.reset-box{fill:#fff;stroke:#6b318f;stroke-width:1.3;stroke-dasharray:5 3}.reset-text{font-family:Georgia,'Times New Roman',serif;font-size:11px;fill:#572477}.memory-label{font-family:Georgia,'Times New Roman',serif;font-size:12px;fill:#572477}.action{fill:#fcfaff;stroke:#6b318f;stroke-width:1.3}.action-label{font-family:Georgia,'Times New Roman',serif;font-size:13px;fill:#572477}</style>
  </defs>

  <rect x="12" y="10" width="666" height="520" rx="9" class="panel"/>
  <rect x="722" y="10" width="666" height="520" rx="9" class="panel-right"/>

  <text x="345" y="39" text-anchor="middle" class="title">(a) Original MemGen</text>
  <text x="345" y="64" text-anchor="middle" class="title">Transient latent memory</text>
  <text x="1055" y="39" text-anchor="middle" class="title-right">(b) Ours</text>
  <text x="1055" y="64" text-anchor="middle" class="title-right">Session-local latent memory management</text>

  <!-- Left modules -->
  <rect x="58" y="278" width="164" height="78" rx="9" class="module"/>
  <text x="140" y="310" text-anchor="middle" class="label" font-weight="600">Reasoner</text><text x="140" y="333" text-anchor="middle" class="small">(Frozen)</text>
  <rect x="264" y="98" width="150" height="74" rx="9" class="module"/>
  <text x="339" y="129" text-anchor="middle" class="label" font-weight="600">Trigger</text><text x="339" y="151" text-anchor="middle" class="small">(Frozen)</text>
  <rect x="430" y="278" width="164" height="78" rx="9" class="module"/>
  <text x="512" y="310" text-anchor="middle" class="label" font-weight="600">Weaver</text><text x="512" y="333" text-anchor="middle" class="small">(Frozen)</text>
  <rect x="487" y="420" width="50" height="34" rx="6" class="node"/>
  <text x="512" y="443" text-anchor="middle" class="label" font-style="italic">m<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <!-- Left: one H_t output trunk branches to Trigger and Weaver -->
  <path d="M222 317 L245 317" class="trunk"/>
  <circle cx="245" cy="317" r="3" fill="#343434"/>
  <path d="M245 317 L245 190 L339 190 L339 172" class="control"/>
  <path d="M245 317 L430 317" class="control"/>
  <text x="270" y="307" text-anchor="middle" class="label" font-style="italic">H<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <!-- Left decisions -->
  <path d="M264 135 L146 135 L146 278" class="control"/>
  <text x="146" y="153" text-anchor="middle" class="small gray">SKIP</text>
  <path d="M414 135 L512 135 L512 278" class="control"/>
  <text x="512" y="153" text-anchor="middle" class="small gray">INVOKE</text>
  <path d="M512 356 L512 420" class="latent"/>
  <path d="M487 437 L140 437 L140 356" class="latent"/>
  <text x="329" y="462" text-anchor="middle" class="tiny" fill="#777777">Not retained after use</text>

  <!-- Right panel: Bank-left / Weaver-right layout -->
  <g id="right-panel">
    <text x="1055" y="39" text-anchor="middle" class="title-right">(b) Ours</text>
    <text x="1055" y="64" text-anchor="middle" class="title-right">Session-local latent memory management</text>
    <rect id="right-reasoner" x="744" y="278" width="164" height="78" rx="9" class="module"/>
    <text x="826" y="324" text-anchor="middle" class="label" font-weight="600">Reasoner</text>
    <text x="826" y="346" text-anchor="middle" class="small gray">(Frozen)</text>
    <rect id="right-trigger" x="950" y="98" width="150" height="74" rx="9" class="module"/>
    <text x="1025" y="143" text-anchor="middle" class="label" font-weight="600">Trigger</text>
    <text x="1025" y="161" text-anchor="middle" class="small gray">(Frozen)</text>

    <!-- One H_t trunk branches to trigger, bank, and Weaver -->
    <path d="M908 317 H930" class="trunk"/><circle cx="930" cy="317" r="3" fill="#343434"/>
    <path d="M930 317 V206 H1025 V172" class="control"/>
    <path d="M950 135 H832 V278" class="control-dashed"/>
    <rect x="806" y="136" width="52" height="24" rx="6" fill="#fff"/><text x="832" y="153" class="small gray" text-anchor="middle">SKIP</text>
    <path d="M1100 135 H1190 V274 H1290 V292" class="control-dashed"/>
    <rect x="1090" y="136" width="82" height="24" rx="6" fill="#fff"/><text x="1131" y="153" class="small gray" text-anchor="middle">INVOKE</text>

    <!-- Compact bank in the middle-left -->
    <rect id="memory-bank" x="1000" y="250" width="180" height="185" rx="11" class="bank"/>
    <text x="1090" y="274" class="bank-title" text-anchor="middle">Session-Local</text>
    <text x="1090" y="293" class="bank-title" text-anchor="middle">Latent Memory Bank</text>
    <text x="1022" y="318" class="slot-label">Slot 1</text><rect x="1070" y="305" width="10" height="17" rx="1" class="token-cell"/><rect x="1083" y="305" width="10" height="17" rx="1" class="token-cell"/><rect x="1096" y="305" width="10" height="17" rx="1" class="token-cell"/><rect x="1109" y="305" width="10" height="17" rx="1" class="token-cell"/><rect x="1122" y="305" width="10" height="17" rx="1" class="token-cell"/><rect x="1135" y="305" width="10" height="17" rx="1" class="token-cell"/><rect x="1148" y="305" width="10" height="17" rx="1" class="token-cell"/><rect x="1161" y="305" width="10" height="17" rx="1" class="token-cell"/><text x="1022" y="345" class="slot-label">Slot 2</text><rect x="1070" y="332" width="10" height="17" rx="1" class="token-cell"/><rect x="1083" y="332" width="10" height="17" rx="1" class="token-cell"/><rect x="1096" y="332" width="10" height="17" rx="1" class="token-cell"/><rect x="1109" y="332" width="10" height="17" rx="1" class="token-cell"/><rect x="1122" y="332" width="10" height="17" rx="1" class="token-cell"/><rect x="1135" y="332" width="10" height="17" rx="1" class="token-cell"/><rect x="1148" y="332" width="10" height="17" rx="1" class="token-cell"/><rect x="1161" y="332" width="10" height="17" rx="1" class="token-cell"/>
    <text x="1045" y="367" class="ellipsis" text-anchor="middle">...</text><text x="1022" y="388" class="slot-label">Slot N</text><rect x="1070" y="375" width="10" height="17" rx="1" class="token-cell"/><rect x="1083" y="375" width="10" height="17" rx="1" class="token-cell"/><rect x="1096" y="375" width="10" height="17" rx="1" class="token-cell"/><rect x="1109" y="375" width="10" height="17" rx="1" class="token-cell"/><rect x="1122" y="375" width="10" height="17" rx="1" class="token-cell"/><rect x="1135" y="375" width="10" height="17" rx="1" class="token-cell"/><rect x="1148" y="375" width="10" height="17" rx="1" class="token-cell"/><rect x="1161" y="375" width="10" height="17" rx="1" class="token-cell"/>
    <line x1="1008" y1="405" x2="1172" y2="405" class="separator"/>
    <text x="1090" y="424" class="bank-foot" text-anchor="middle">Capacity-aware replacement</text>
    <rect id="reset-session" x="1028" y="195" width="124" height="32" rx="6" class="reset-box"/>
    <text x="1090" y="216" class="reset-text" text-anchor="middle">Reset at session end</text>
    <path d="M1090 250 V227" class="memory-dashed"/>

    <!-- Query H_t to Bank; retrieve R_t horizontally to Weaver -->
    <path d="M930 317 V240 H1055 V250" class="memory" marker-end="url(#arrow-purple)"/>
    <rect x="895" y="213" width="126" height="25" rx="6" fill="#fff"/><text x="958" y="230" class="memory-label" text-anchor="middle">Query with <tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="9">t</tspan></text>
    <path d="M1180 405 H1200 V358 H1215" class="memory" marker-end="url(#arrow-purple)"/>
    <rect x="1184" y="378" width="132" height="22" rx="6" fill="#fff"/><text x="1250" y="394" class="memory-label" text-anchor="middle">Retrieve top-k <tspan font-style="italic">R</tspan><tspan baseline-shift="sub" font-size="9">t</tspan></text>

    <!-- Weaver on the right: only H_t and R_t are conditioning inputs -->
    <rect id="right-weaver" x="1215" y="292" width="150" height="78" rx="9" class="module"/>
    <text x="1290" y="338" text-anchor="middle" class="label" font-weight="600">Weaver</text>
    <text x="1290" y="360" text-anchor="middle" class="small gray">(Frozen)</text>
    <path d="M930 317 V445 H1195 V331 H1215" class="control"/>
    <text x="952" y="437" class="math" text-anchor="middle"><tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="10">t</tspan></text>
    <rect id="right-mt" x="1262" y="405" width="56" height="34" rx="6" class="node"/>
    <text x="1290" y="428" class="label" text-anchor="middle" font-style="italic">m<tspan baseline-shift="sub" font-size="10">t</tspan></text>
    <path d="M1290 370 V405" class="latent"/>
    <!-- Independent m_t paths: blue injection and purple write-back -->
    <path d="M1290 439 V512 H826 V356" class="latent"/>
    <rect id="insert-update" x="1090" y="460" width="120" height="34" rx="7" class="action"/>
    <text x="1150" y="482" class="action-label" text-anchor="middle">Insert / Update</text>
    <path d="M1262 422 H1210 V477 H1210" class="memory" marker-end="url(#arrow-purple)"/>
    <path d="M1090 477 H1060 V435" class="memory" marker-end="url(#arrow-purple)"/>
  </g>
  <!-- Legend and footer -->
  <line x1="360" y1="565" x2="410" y2="565" stroke="#343434" stroke-width="2" marker-end="url(#arrow-gray)"/><text x="422" y="570" class="small">Control / reasoning flow</text>
  <line x1="650" y1="565" x2="700" y2="565" stroke="#1f5aa6" stroke-width="2.25" marker-end="url(#arrow-blue)"/><text x="712" y="570" class="small">Latent-memory flow</text>
  <line x1="930" y1="565" x2="980" y2="565" stroke="#6b318f" stroke-width="2.2" marker-end="url(#arrow-purple)"/><text x="992" y="570" class="small">Session-local memory access / write</text>
  <text x="700" y="615" text-anchor="middle" class="small" font-weight="600">All MemGen modules are frozen; only session-local memory state changes.</text>
</svg>
