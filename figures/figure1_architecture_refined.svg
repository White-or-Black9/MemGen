<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <title>Original MemGen versus session-local latent memory management</title>
  <desc>Editable vector architecture diagram. Dark gray denotes reasoning and control, blue denotes generated latent memory, and purple denotes session-local memory access and write.</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#343434"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5aa6"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6b318f"/></marker>
    <style>
      .panel { fill:#ffffff; stroke:#9aa9bd; stroke-width:1.25; }
      .panel-right { fill:#ffffff; stroke:#b595cb; stroke-width:1.25; }
      .module { fill:#f8fafc; stroke:#274f8f; stroke-width:1.5; }
      .node { fill:#ffffff; stroke:#404040; stroke-width:1.2; }
      .bank { fill:#fcfaff; stroke:#6b318f; stroke-width:1.6; }
      .control { fill:none; stroke:#343434; stroke-width:2; marker-end:url(#arrow-gray); }
      .trunk { fill:none; stroke:#343434; stroke-width:2; }
      .control-dashed { fill:none; stroke:#343434; stroke-width:2; stroke-dasharray:6 5; marker-end:url(#arrow-gray); }
      .latent { fill:none; stroke:#1f5aa6; stroke-width:2.25; marker-end:url(#arrow-blue); }
      .memory { fill:none; stroke:#6b318f; stroke-width:2.2; marker-end:url(#arrow-purple); }
      .memory-dashed { fill:none; stroke:#6b318f; stroke-width:1.5; stroke-dasharray:5 4; marker-end:url(#arrow-purple); }
      .title { font-family:Georgia, 'Times New Roman', serif; font-size:22px; font-weight:600; fill:#1f3f78; }
      .title-right { font-family:Georgia, 'Times New Roman', serif; font-size:22px; font-weight:600; fill:#572477; }
      .label { font-family:Georgia, 'Times New Roman', serif; font-size:16px; fill:#161616; }
      .small { font-family:Georgia, 'Times New Roman', serif; font-size:12.5px; fill:#353535; }
      .tiny { font-family:Georgia, 'Times New Roman', serif; font-size:11.5px; fill:#353535; }
      .gray { fill:#343434; } .blue { fill:#1f5aa6; } .purple { fill:#6b318f; }

      .label-bg{fill:#ffffff;stroke:none;}
      .math-label{font-family:Georgia,'Times New Roman',serif;font-size:15px;fill:#202b3a;}
      .token-cell{fill:#f1eafa;stroke:#6b318f;stroke-width:1;}
      .bank-title{font-family:Georgia,'Times New Roman',serif;font-size:14px;font-weight:600;fill:#572477;}
      .slot-label{font-family:Georgia,'Times New Roman',serif;font-size:12px;fill:#572477;}
      .bank-note{font-family:Georgia,'Times New Roman',serif;font-size:10.5px;fill:#725782;}
      .bank-foot{font-family:Georgia,'Times New Roman',serif;font-size:9.5px;fill:#572477;}
      .reset-box{fill:#ffffff;stroke:#6b318f;stroke-width:1.2;stroke-dasharray:5 3;}
      .reset-text{font-family:Georgia,'Times New Roman',serif;font-size:10.5px;fill:#572477;}
      .memory-label{font-family:Georgia,'Times New Roman',serif;font-size:11.5px;fill:#572477;}
      .action{fill:#fcfaff;stroke:#6b318f;stroke-width:1.3;}
      .action-label{font-family:Georgia,'Times New Roman',serif;font-size:12.5px;fill:#572477;}
    </style>
  </defs>

  <rect x="12" y="10" width="666" height="520" rx="9" class="panel"/>
  <rect x="722" y="10" width="666" height="520" rx="9" class="panel-right"/>

  <text x="345" y="39" text-anchor="middle" class="title">(a) Original MemGen</text>
  <text x="345" y="64" text-anchor="middle" class="title">Transient latent memory</text>
  <text x="1055" y="39" text-anchor="middle" class="title-right">(b) Ours</text>
  <text x="1055" y="64" text-anchor="middle" class="title-right">Session-local latent memory management</text>

  <!-- Left modules -->
  <rect x="58" y="278" width="164" height="78" rx="9" class="module"/>
  <text x="140" y="310" text-anchor="middle" class="label" font-weight="600">Reasoner</text><text x="140" y="333" text-anchor="middle" class="small">(Frozen)</text>
  <rect x="264" y="98" width="150" height="74" rx="9" class="module"/>
  <text x="339" y="129" text-anchor="middle" class="label" font-weight="600">Trigger</text><text x="339" y="151" text-anchor="middle" class="small">(Frozen)</text>
  <rect x="430" y="278" width="164" height="78" rx="9" class="module"/>
  <text x="512" y="310" text-anchor="middle" class="label" font-weight="600">Weaver</text><text x="512" y="333" text-anchor="middle" class="small">(Frozen)</text>
  <rect x="487" y="420" width="50" height="34" rx="6" class="node"/>
  <text x="512" y="443" text-anchor="middle" class="label" font-style="italic">m<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <!-- Left: one H_t output trunk branches to Trigger and Weaver -->
  <path d="M222 317 L245 317" class="trunk"/>
  <circle cx="245" cy="317" r="3" fill="#343434"/>
  <path d="M245 317 L245 190 L339 190 L339 172" class="control"/>
  <path d="M245 317 L430 317" class="control"/>
  <text x="270" y="307" text-anchor="middle" class="label" font-style="italic">H<tspan baseline-shift="sub" font-size="10">t</tspan></text>
  <!-- Left decisions -->
  <path d="M264 135 L146 135 L146 278" class="control"/>
  <text x="146" y="153" text-anchor="middle" class="small gray">SKIP</text>
  <path d="M414 135 L512 135 L512 278" class="control"/>
  <text x="512" y="153" text-anchor="middle" class="small gray">INVOKE</text>
  <path d="M512 356 L512 420" class="latent"/>
  <path d="M487 437 L140 437 L140 356" class="latent"/>
  <text x="329" y="462" text-anchor="middle" class="tiny" fill="#777777">Not retained after use</text>

  <!-- Right panel: refined Bank-below / Weaver-right layout -->
  <g id="right-panel">
    <!-- Primary modules: aligned reasoning and generation row -->
    <rect id="right-reasoner" x="760" y="235" width="164" height="78" rx="9" class="module"/>
    <text x="842" y="267" text-anchor="middle" class="label" font-weight="600">Reasoner</text>
    <text x="842" y="290" text-anchor="middle" class="small">(Frozen)</text>
    <rect id="right-weaver" x="1188" y="235" width="164" height="78" rx="9" class="module"/>
    <text x="1270" y="267" text-anchor="middle" class="label" font-weight="600">Weaver</text>
    <text x="1270" y="290" text-anchor="middle" class="small">(Frozen)</text>
    <rect id="right-trigger" x="978" y="105" width="150" height="74" rx="9" class="module"/>
    <text x="1053" y="136" text-anchor="middle" class="label" font-weight="600">Trigger</text>
    <text x="1053" y="158" text-anchor="middle" class="small">(Frozen)</text>

    <!-- Direct H_t main path, with distinct branches to Trigger and Bank -->
    <path d="M924 274 H1188" class="control"/>
    <rect x="1023" y="249" width="54" height="21" rx="5" class="label-bg"/>
    <text x="1050" y="264" text-anchor="middle" class="math-label" font-style="italic">Hₜ</text>
    <path d="M950 274 V198 H1053 V179" class="control"/>
    <path d="M1030 274 V355 H977 V380" class="memory"/>
    <rect x="900" y="327" width="124" height="23" rx="5" class="label-bg"/>
    <text x="976" y="343" text-anchor="end" class="memory-label">Query with</text>
    <text x="981" y="343" class="memory-label" font-style="italic">Hₜ</text>

    <!-- Trigger decisions: separate dashed control paths -->
    <path d="M978 142 H800 V235 H842" class="control-dashed"/>
    <rect x="812" y="120" width="55" height="22" rx="5" class="label-bg"/>
    <text x="839" y="136" text-anchor="middle" class="small gray">SKIP</text>
    <path d="M1128 142 H1270 V235" class="control-dashed"/>
    <rect x="1141" y="120" width="82" height="22" rx="5" class="label-bg"/>
    <text x="1182" y="136" text-anchor="middle" class="small gray">INVOKE</text>

    <!-- Compressed horizontal session-local memory bank -->
    <rect id="memory-bank" x="842" y="380" width="266" height="92" rx="11" class="bank"/>
    <text x="975" y="402" text-anchor="middle" class="bank-title">Session-Local Latent Memory Bank</text>
    <text x="869" y="427" class="slot-label">Slot i</text><rect x="920" y="414" width="11" height="17" rx="1.4" class="token-cell"/><rect x="934" y="414" width="11" height="17" rx="1.4" class="token-cell"/><rect x="948" y="414" width="11" height="17" rx="1.4" class="token-cell"/><rect x="962" y="414" width="11" height="17" rx="1.4" class="token-cell"/><rect x="976" y="414" width="11" height="17" rx="1.4" class="token-cell"/><rect x="990" y="414" width="11" height="17" rx="1.4" class="token-cell"/><rect x="1004" y="414" width="11" height="17" rx="1.4" class="token-cell"/><rect x="1018" y="414" width="11" height="17" rx="1.4" class="token-cell"/>
    <text x="869" y="449" class="bank-note">× N bounded slots</text>
    <text x="1083" y="463" text-anchor="end" class="bank-foot">Capacity-aware replacement</text>
    <rect id="reset-session" x="740" y="340" width="128" height="25" rx="6" class="reset-box"/>
    <text x="804" y="357" text-anchor="middle" class="reset-text">Reset at session end</text>
    <path d="M868 352 H890 V380" class="memory-dashed"/>

    <!-- R_t retrieval: a short, visually separate lower input to Weaver -->
    <path d="M1108 425 H1150 V294 H1188" class="memory"/>
    <rect x="1035" y="326" width="142" height="23" rx="5" class="label-bg"/>
    <text x="1137" y="342" text-anchor="end" class="memory-label">Retrieve top-k</text>
    <text x="1142" y="342" class="memory-label" font-style="italic">Rₜ</text>

    <!-- Explicit m_t node and two independent outputs -->
    <rect id="right-mt" x="1242" y="325" width="56" height="34" rx="6" class="node"/>
    <text x="1270" y="348" class="label" text-anchor="middle" font-style="italic">m<tspan baseline-shift="sub" font-size="10">t</tspan></text>
    <path d="M1270 313 V325" class="latent"/>
    <path d="M1270 359 V500 H800 V330 H842 V313" class="latent"/>
    <rect id="insert-update" x="1135" y="400" width="120" height="34" rx="7" class="action"/>
    <text x="1195" y="422" class="action-label" text-anchor="middle">Insert / Update</text>
    <path d="M1242 342 H1270 V417 H1255" class="memory"/>
    <path d="M1135 417 H1108" class="memory"/>
  </g>
  <!-- Legend and footer -->
  <line x1="360" y1="565" x2="410" y2="565" stroke="#343434" stroke-width="2" marker-end="url(#arrow-gray)"/><text x="422" y="570" class="small">Control / reasoning flow</text>
  <line x1="650" y1="565" x2="700" y2="565" stroke="#1f5aa6" stroke-width="2.25" marker-end="url(#arrow-blue)"/><text x="712" y="570" class="small">Latent-memory flow</text>
  <line x1="930" y1="565" x2="980" y2="565" stroke="#6b318f" stroke-width="2.2" marker-end="url(#arrow-purple)"/><text x="992" y="570" class="small">Session-local memory access / write</text>
  <text x="700" y="615" text-anchor="middle" class="small" font-weight="600">All MemGen modules are frozen; only session-local memory state changes.</text>
</svg>
